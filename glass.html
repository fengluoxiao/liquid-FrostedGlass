                    <div class="logo-img"

    <script src="index.js"></script>
    <style>
        :root {
            /* Inner shadow */
            --shadow-offset: 0;
            --shadow-blur: 5px;
            --shadow-spread: -1px;
            --shadow-color: rgba(255, 255, 255, 0.7);

            /* Painted glass */
            --tint-color: 255, 255, 255;
            --tint-opacity: 0.11; /* Default opacity */
            --tint-opacity-active: 0.25; /* Active state opacity for brightness */

            /* Background frost */
            --frost-blur: 9px;

            /* SVG noise/distortion */
            --noise-frequency: 0.000;
            --distortion-strength: 77;

            /* Outer shadow blur */
            --outer-shadow-blur: 32px;
        }

        body {
            margin: 0;
            height: 100vh;
            background: url(https://images.unsplash.com/photo-1618221195710-dd6b41faaea6?q=80&w=2000&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfDB8fGVufDB8fHx8fA%3D%3D) center / cover no-repeat;
            font-family: sans-serif;
            font-weight: 300;
        }

        .container {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        .glass {
            position: absolute;
            width: 400px;
            height: 50px;
            border-radius: 28px;
            cursor: move;
            padding: 10px;
            bottom: 13px;
            isolation: isolate;
            touch-action: none;
            box-shadow: 0px 6px var(--outer-shadow-blur) rgba(0, 0, 0, 0.2);
            z-index: 0;
            transition: transform 0.35s cubic-bezier(.4,1.5,.5,1);
        }

        .glass::before {
            content: '';
            position: absolute;
            inset: 0;
            z-index: 0;
            border-radius: 28px;
            box-shadow: inset var(--shadow-offset) var(--shadow-offset) var(--shadow-blur) var(--shadow-spread) var(--shadow-color);
            background-color: rgba(var(--tint-color), var(--tint-opacity));
            transition: background-color 0.35s ease;
        }

        .glass::after {
            content: '';
            position: absolute;
            inset: 0;
            z-index: -1;
            border-radius: 28px;
            backdrop-filter: blur(var(--frost-blur));
            filter: url(#glass-distortion);
            isolation: isolate;
            -webkit-backdrop-filter: blur(var(--frost-blur));
            -webkit-filter: url(#glass-distortion);
        }

        .content {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 50px;
            position: relative;
            gap: 32px;
        }

        .content span {
            font-size: 14px;
            font-weight: 600;
        }

        .logo {
            width: 80px;
            height: 50px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            z-index: 1;
            cursor: pointer;
            margin-right: 0;
            padding-top: 5px;
        }

        .logo:last-child {
            margin-right: 0;
        }

        .logo_active {
            /* 移除向上移动效果 */
        }

        .logo_active::before {
            /* 移除向上移动效果 */
        }

        .logo-img {
           
        }

        .logo_active .logo-img {
            /* 移除放大效果 */
        }

        .logo span {
            user-select: none;
            
        }

        .logo span,
        .logo svg {
            color: #fff;
            opacity: 0.85;
            
        }
        .logo_active span {
            /* 移除向上移动效果 */
        }

        .logo-text-active,
        .logo-text-active~.logo-img svg {
            color: #3388bb !important;
        }

        .slider-bg {
            position: absolute;
            top: 50%;
            left: -6px;
            width: 86px;
            height: 64px;
            border-radius: 28px;
            background-color: rgba(var(--tint-color), var(--tint-opacity));
            box-shadow: inset var(--shadow-offset) var(--shadow-offset) var(--shadow-blur) var(--shadow-spread) var(--shadow-color);
            transform: translateY(-50%) translateX(0);
            transition: transform 0.5s cubic-bezier(.4,1.5,.5,1),
                        width 0.5s cubic-bezier(.4,0,.5,1),
                        height 0.5s cubic-bezier(.4,1.5,.5,1),
                        background 0.5s;
            z-index: 0;
        }
        .slider-bg.is-squashing {
            width: 96px;
            height: 50px;
        }

        .logo-text-active {
            color: #3388bb !important;
            opacity: 1 !important;
        }

        .logo-svg-active {
            color: #3388bb !important;
            opacity: 1 !important;
        }

        .glass-active {
            transform: scale(1.05);
            transition: transform 0.5s;
            --tint-opacity: var(--tint-opacity-active);
        }
    </style>
</body>

</html>
